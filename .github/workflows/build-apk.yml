name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q ShopItemRateApp_v2_source.zip -d project

      - name: Find project folder
        run: |
          find project -maxdepth 3 -type f | head -50

      - name: Build APK
       working-directory: project/ShopItemRateApp
        run: |
    gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
        name: ShopItemRate-debug-apk
        path: project/ShopItemRateApp/app/build/outputs/apk/debug/*.apk
  
